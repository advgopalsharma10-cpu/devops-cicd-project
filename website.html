<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive React Animation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0/client",
            "framer-motion": "https://esm.sh/framer-motion@10.16.4",
            "lucide-react": "https://esm.sh/lucide-react@0.284.0"
        }
    }
    </script>

    <style>
        /* Custom smooth scroll and font */
        body {
            margin: 0;
            background-color: #020617;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Custom animation for the background glow */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 8s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom';
        import { motion, AnimatePresence } from 'framer-motion';
        import { Rocket, Sparkles, ChevronRight, MousePointer2 } from 'lucide-react';

        const App = () => {
            const [isHovered, setIsHovered] = useState(false);

            // Animation Variants
            const containerVars = {
                hidden: { opacity: 0 },
                visible: { 
                    opacity: 1,
                    transition: { staggerChildren: 0.3, delayChildren: 0.2 }
                }
            };

            const itemVars = {
                hidden: { y: 20, opacity: 0 },
                visible: { y: 0, opacity: 1, transition: { duration: 0.8, ease: "easeOut" } }
            };

            return (
                <div className="relative min-h-screen w-full flex items-center justify-center bg-slate-950 overflow-hidden">
                    
                    {/* Blurred Background Elements */}
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-purple-900/30 rounded-full blur-[120px] animate-pulse-slow"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-900/20 rounded-full blur-[120px] animate-pulse-slow" style={{ animationDelay: '2s' }}></div>

                    <motion.div 
                        variants={containerVars}
                        initial="hidden"
                        animate="visible"
                        className="relative z-10 text-center px-4"
                    >
                        {/* Interactive Icon */}
                        <motion.div
                            variants={itemVars}
                            whileHover={{ rotate: 15, scale: 1.1 }}
                            className="inline-flex items-center justify-center w-20 h-20 mb-8 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl cursor-pointer"
                        >
                            <Rocket className="w-10 h-10 text-purple-400" />
                        </motion.div>

                        {/* Title with Gradient */}
                        <motion.h1 
                            variants={itemVars}
                            className="text-5xl md:text-8xl font-black text-white tracking-tighter mb-6"
                        >
                            CRAFTING <br />
                            <span className="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 bg-clip-text text-transparent">
                                DIGITAL MAGIC
                            </span>
                        </motion.h1>

                        <motion.p 
                            variants={itemVars}
                            className="max-w-xl mx-auto text-slate-400 text-lg md:text-xl mb-10 leading-relaxed"
                        >
                            This is a single-file React experience using Framer Motion 
                            and Tailwind CSS. No build step required—just pure code.
                        </motion.p>

                        {/* Buttons */}
                        <motion.div 
                            variants={itemVars}
                            className="flex flex-col sm:flex-row items-center justify-center gap-4"
                        >
                            <motion.button
                                whileHover={{ scale: 1.05, boxShadow: "0 0 20px rgba(168, 85, 247, 0.4)" }}
                                whileTap={{ scale: 0.95 }}
                                className="group relative px-8 py-4 bg-purple-600 text-white rounded-full font-bold flex items-center gap-2 overflow-hidden"
                            >
                                Launch Project
                                <ChevronRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                            </motion.button>

                            <motion.button
                                whileHover={{ backgroundColor: "rgba(255,255,255,0.1)" }}
                                className="px-8 py-4 border border-white/10 text-white rounded-full font-bold flex items-center gap-2 backdrop-blur-md"
                            >
                                <Sparkles className="w-5 h-5 text-yellow-400" />
                                View Demo
                            </motion.button>
                        </motion.div>

                        {/* Interactive Interaction Hint */}
                        <motion.div 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 2 }}
                            className="mt-16 flex items-center justify-center gap-2 text-slate-500 text-sm uppercase tracking-widest"
                        >
                            <MousePointer2 className="w-4 h-4 animate-bounce" />
                            Hover everything
                        </motion.div>
                    </motion.div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
